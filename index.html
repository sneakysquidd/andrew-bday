<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>wake up, andrew_</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23030803'/%3E%3Crect x='2' y='6' width='12' height='4' rx='2' fill='%2300ff66'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Share+Tech+Mono&family=Press+Start+2P&family=Playfair+Display:ital,wght@0,400;0,500;0,700;1,400;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/matrix.css">
<link rel="stylesheet" href="css/godzilla.css">
<link rel="stylesheet" href="css/robe.css">
<link rel="stylesheet" href="css/clock.css">
</head>
<body class="theme-matrix">

<canvas id="rain" aria-hidden="true"></canvas>

<main id="main">

  <!-- ================= PILL SCENE ================= -->
  <section id="screen-pills" class="screen screen-matrix active" aria-label="Choose your pill">
    <div class="term-wrap">
      <div class="term-log" id="term-log" aria-live="polite"></div>
      <div class="pills" id="pills">
        <button class="pill-btn" data-gift="godzilla" aria-label="Red pill" disabled>
          <span class="pill pill-red"><span class="pill-shine"></span></span>
          <span class="pill-label">red</span>
          <span class="pill-visited" aria-hidden="true">✓</span>
        </button>
        <button class="pill-btn" data-gift="robe" aria-label="Black pill" disabled>
          <span class="pill pill-black"><span class="pill-shine"></span></span>
          <span class="pill-label">black</span>
          <span class="pill-visited" aria-hidden="true">✓</span>
        </button>
        <button class="pill-btn" data-gift="clock" aria-label="Blue pill" disabled>
          <span class="pill pill-blue"><span class="pill-shine"></span></span>
          <span class="pill-label">blue</span>
          <span class="pill-visited" aria-hidden="true">✓</span>
        </button>
      </div>
      <p class="pill-hint" id="pill-hint">&nbsp;</p>
      <p class="term-footer" id="term-footer"></p>
    </div>
  </section>

  <!-- ================= GODZILLA / PIXEL ARCADE ================= -->
  <section id="screen-godzilla" class="screen screen-godzilla" aria-label="Godzilla gift option" hidden>
    <header class="gz-hud">
      <span class="gz-hud-item">1UP&nbsp;&nbsp;ANDREW</span>
      <span class="gz-hud-item gz-blink">★ HAPPY BDAY ★</span>
      <span class="gz-hud-item">CREDIT&nbsp;&nbsp;$110</span>
    </header>

    <div class="gz-body">
      <p class="gz-stage">STAGE 1</p>
      <h1 class="gz-title" id="gz-title"></h1>
      <div class="gz-prize-banner"><span id="gz-prize"></span></div>
      <p class="gz-blurb" id="gz-blurb"></p>
      <div class="gz-grid" id="gz-grid"></div>
      <p class="gz-store-link"><a id="gz-store" target="_blank" rel="noopener"></a></p>
      <div class="screen-actions">
        <button class="gz-btn js-back">▲ BACK TO THE CONSTRUCT</button>
        <button class="gz-btn gz-btn-claim js-claim" data-gift="godzilla">★ CLAIM THIS GIFT</button>
      </div>
    </div>

    <div class="gz-skyline" aria-hidden="true">
      <svg viewBox="0 0 800 90" preserveAspectRatio="xMidYMax slice" width="100%" height="100%">
        <g fill="#1c1440">
          <rect x="0" y="38" width="34" height="52"/><rect x="40" y="56" width="26" height="34"/>
          <rect x="74" y="26" width="30" height="64"/><rect x="112" y="48" width="38" height="42"/>
          <rect x="158" y="34" width="24" height="56"/><rect x="190" y="60" width="34" height="30"/>
          <rect x="232" y="22" width="30" height="68"/><rect x="270" y="46" width="26" height="44"/>
          <rect x="304" y="58" width="36" height="32"/><rect x="348" y="30" width="28" height="60"/>
          <rect x="384" y="52" width="32" height="38"/><rect x="424" y="40" width="26" height="50"/>
          <rect x="458" y="62" width="34" height="28"/><rect x="500" y="28" width="30" height="62"/>
          <rect x="538" y="50" width="26" height="40"/><rect x="572" y="36" width="34" height="54"/>
          <rect x="614" y="58" width="28" height="32"/><rect x="650" y="24" width="30" height="66"/>
          <rect x="688" y="46" width="26" height="44"/><rect x="722" y="56" width="36" height="34"/>
          <rect x="766" y="38" width="34" height="52"/>
        </g>
        <g fill="#ffd23e">
          <rect x="6" y="44" width="4" height="4"/><rect x="16" y="54" width="4" height="4"/><rect x="24" y="44" width="4" height="4"/>
          <rect x="80" y="34" width="4" height="4"/><rect x="92" y="44" width="4" height="4"/><rect x="80" y="56" width="4" height="4"/>
          <rect x="120" y="56" width="4" height="4"/><rect x="136" y="64" width="4" height="4"/>
          <rect x="240" y="30" width="4" height="4"/><rect x="250" y="42" width="4" height="4"/><rect x="240" y="54" width="4" height="4"/>
          <rect x="356" y="38" width="4" height="4"/><rect x="364" y="50" width="4" height="4"/>
          <rect x="508" y="36" width="4" height="4"/><rect x="518" y="48" width="4" height="4"/><rect x="508" y="60" width="4" height="4"/>
          <rect x="580" y="44" width="4" height="4"/><rect x="592" y="56" width="4" height="4"/>
          <rect x="658" y="32" width="4" height="4"/><rect x="668" y="44" width="4" height="4"/><rect x="658" y="58" width="4" height="4"/>
          <rect x="730" y="62" width="4" height="4"/><rect x="744" y="62" width="4" height="4"/>
        </g>
        <g class="gz-kaiju" fill="#2f9e4f">
          <g class="gz-frame-a">
            <rect x="34" y="60" width="8" height="30"/><rect x="58" y="60" width="8" height="26"/>
            <rect x="30" y="86" width="14" height="4"/><rect x="56" y="82" width="14" height="4"/>
            <rect x="32" y="34" width="40" height="28"/>
            <rect x="0" y="50" width="34" height="10"/><rect x="-10" y="56" width="16" height="8"/>
            <rect x="60" y="20" width="22" height="18"/><rect x="80" y="26" width="12" height="10"/>
            <rect x="44" y="26" width="8" height="10"/><rect x="56" y="14" width="8" height="8"/><rect x="38" y="20" width="8" height="8"/>
            <rect x="86" y="28" width="4" height="4" fill="#ffd23e"/>
          </g>
          <g class="gz-frame-b">
            <rect x="36" y="60" width="8" height="26"/><rect x="56" y="60" width="8" height="30"/>
            <rect x="32" y="82" width="14" height="4"/><rect x="54" y="86" width="14" height="4"/>
            <rect x="32" y="34" width="40" height="28"/>
            <rect x="0" y="46" width="34" height="10"/><rect x="-12" y="40" width="16" height="8"/>
            <rect x="60" y="20" width="22" height="18"/><rect x="80" y="26" width="12" height="10"/>
            <rect x="44" y="26" width="8" height="10"/><rect x="56" y="14" width="8" height="8"/><rect x="38" y="20" width="8" height="8"/>
            <rect x="86" y="28" width="4" height="4" fill="#ffd23e"/>
          </g>
        </g>
      </svg>
    </div>
    <div class="gz-scanlines" aria-hidden="true"></div>
  </section>

  <!-- ================= ROBE / TAILORED PLAID ================= -->
  <section id="screen-robe" class="screen screen-robe" aria-label="Robe gift option" hidden>
    <div class="rb-tartan-band rb-band-top" aria-hidden="true"></div>
    <div class="rb-body">
      <p class="rb-eyebrow">Baturina Homewear · the atelier collection</p>
      <div class="rb-seal" aria-hidden="true"><span>A</span></div>
      <h1 class="rb-title" id="rb-title"></h1>
      <p class="rb-rule" aria-hidden="true">❦</p>
      <p class="rb-prize" id="rb-prize"></p>
      <p class="rb-blurb" id="rb-blurb"></p>
      <div class="rb-grid" id="rb-grid"></div>
      <p class="rb-store-link"><a id="rb-store" target="_blank" rel="noopener"></a></p>
      <div class="screen-actions">
        <button class="rb-btn js-back">Return to the construct</button>
        <button class="rb-btn rb-btn-claim js-claim" data-gift="robe">Claim this gift</button>
      </div>
    </div>
    <div class="rb-tartan-band rb-band-bottom" aria-hidden="true"></div>
  </section>

  <!-- ================= CLOCK / ARCANE LUXE ================= -->
  <section id="screen-clock" class="screen screen-clock" aria-label="Alarm clock gift option" hidden>
    <div class="ck-body">
      <p class="ck-eyebrow">— the final duel —</p>
      <h1 class="ck-title" id="ck-title"></h1>
      <p class="ck-blurb" id="ck-blurb"></p>
      <div class="ck-cards" id="ck-cards"></div>
      <div class="ck-compare-wrap">
        <h2 class="ck-compare-title">Scrying the differences</h2>
        <table class="ck-compare" id="ck-compare"></table>
      </div>
      <div class="screen-actions">
        <button class="ck-btn js-back">⟵ Return to the construct</button>
        <button class="ck-btn ck-btn-claim js-claim" data-gift="clock">✦ Claim this gift</button>
      </div>
    </div>
  </section>

  <!-- ================= LOCKED / FINAL ================= -->
  <section id="screen-locked" class="screen screen-matrix" aria-label="Choice confirmed" hidden>
    <div class="term-wrap">
      <div class="locked-box">
        <p class="locked-title" id="locked-title"></p>
        <p class="locked-gift" id="locked-gift"></p>
        <p class="locked-body" id="locked-body"></p>
        <p class="locked-note" id="locked-note"></p>
        <p class="locked-sig" id="locked-sig"></p>
        <div class="screen-actions">
          <a class="term-btn" id="locked-transmit" href="#"></a>
          <button class="term-btn js-unlock" id="locked-back"></button>
        </div>
      </div>
    </div>
  </section>

</main>

<!-- ================= CONFIRM OVERLAY ================= -->
<div id="confirm-overlay" class="confirm-overlay" role="dialog" aria-modal="true" aria-labelledby="confirm-text" hidden>
  <div class="confirm-box">
    <p class="confirm-text" id="confirm-text"></p>
    <div class="confirm-actions">
      <button class="term-btn" id="confirm-yes"></button>
      <button class="term-btn" id="confirm-no"></button>
    </div>
  </div>
</div>

<div id="glitch-overlay" aria-hidden="true"></div>

<script src="config.js"></script>
<script src="js/rain.js"></script>
<script src="js/typewriter.js"></script>
<script src="js/config-render.js"></script>
<script src="js/main.js"></script>
</body>
</html>
